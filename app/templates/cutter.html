<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTube Studio — Video Cutter & Trimmer</title>
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=2.0">
</head>
<body class="yt-dark-theme">
    <div class="app-container">
        <header class="yt-navbar">
            <div class="yt-brand-section" style="display: flex; align-items: center; gap: 0.75rem;">
                <button onclick="if(document.referrer && document.referrer.includes(window.location.host)) { history.back(); } else { window.location.href='/download.html'; }" class="yt-icon-btn" title="Back" style="background: var(--bg-hover); border-radius: 50%; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: var(--text-primary);">
                    <i data-lucide="arrow-left"></i>
                </button>
                <a href="/download.html" class="yt-logo-group" style="text-decoration:none; color:inherit;">
                    <img src="/static/img/logo.png" alt="YTube Studio Logo" class="yt-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="brand-icon" style="display:none;">
                        <i data-lucide="play" class="yt-play-icon"></i>
                    </div>
                    <span class="yt-brand-name">YTube Studio</span>
                    <span class="yt-country-code">IN</span>
                </a>
            </div>
        </header>

        <div class="app-layout-wrapper">
            <aside class="yt-mini-sidebar">
                <a href="/download.html" class="mini-nav-item" title="Home / Download">
                    <i data-lucide="home"></i>
                </a>
                <a href="/cutter.html" class="mini-nav-item active" title="Video Cutter / Trimmer">
                    <i data-lucide="scissors"></i>
                </a>
                <a href="/split.html" class="mini-nav-item" title="Video Splitter">
                    <i data-lucide="grid"></i>
                </a>
                <a href="/mix.html" class="mini-nav-item" title="Video & Audio Mixer">
                    <i data-lucide="layers"></i>
                </a>
                <a href="/playlist.html" class="mini-nav-item" title="Playlist Batch">
                    <i data-lucide="list-video"></i>
                </a>
            </aside>

            <main class="main-content">
                <!-- Progress Bar -->
                <div id="progress-container" class="progress-container hidden">
                    <div class="progress-label">
                        <span id="txt-progress-status">Processing video...</span>
                        <span id="txt-progress-percent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>

                <section id="tab-trimmer" class="tab-panel active">
                    <div class="card">
                        <div class="card-header-bar" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <button onclick="if(document.referrer && document.referrer.includes(window.location.host)) { history.back(); } else { window.location.href='/download.html'; }" class="yt-icon-btn" title="Go Back" style="background: var(--bg-hover); border-radius: 50%; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: var(--text-primary);">
                                    <i data-lucide="arrow-left"></i>
                                </button>
                                <div>
                                    <h2 style="margin:0;">YouTube Video Cutter & Trimmer</h2>
                                    <p class="subtitle" style="margin:0;">Select a downloaded video to preview and extract precise video clips.</p>
                                </div>
                            </div>
                            <a href="/download.html" class="yt-pill-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
                                <i data-lucide="home"></i> Home
                            </a>
                        </div>

                        <div class="media-library-section">
                            <h3>Select Downloaded Video to Trim:</h3>
                            <div id="container-trim-media-list" class="media-library-grid">
                                <p class="empty-library-msg">No downloaded videos yet. <a href="/download" style="color:var(--brand-orange)">Download a video first!</a></p>
                            </div>
                        </div>

                        <div id="wrapper-trim-preview" class="media-player-wrapper hidden">
                            <video id="player-trim-preview" controls class="media-preview-player"></video>
                        </div>

                        <form id="form-trim-video" class="editor-form">
                            <div class="form-group">
                                <label for="input-trim-filepath">Target File Path:</label>
                                <input type="text" id="input-trim-filepath" placeholder="Select a video above or paste file path" required class="custom-select">
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="input-trim-start">Start Time (HH:MM:SS):</label>
                                    <input type="text" id="input-trim-start" placeholder="00:00:00" value="00:00:00" required class="custom-select">
                                </div>
                                <div class="form-group">
                                    <label for="input-trim-end">End Time (HH:MM:SS):</label>
                                    <input type="text" id="input-trim-end" placeholder="00:01:30" required class="custom-select">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="select-trim-format">Output Format:</label>
                                    <select id="select-trim-format" class="custom-select">
                                        <option value="mp4">MP4 Video (Standard H.264)</option>
                                        <option value="webm">WebM Video (VP9)</option>
                                        <option value="mkv">MKV Container</option>
                                        <option value="mp3">MP3 Audio Stream</option>
                                        <option value="wav">WAV Lossless Audio</option>
                                        <option value="aac">AAC Audio Stream</option>
                                    </select>
                                </div>
                                <div class="form-group toggle-group">
                                    <label>Frame-Exact Re-encoding:</label>
                                    <label class="switch-label">
                                        <input type="checkbox" id="chk-trim-accurate">
                                        <span class="switch-text">H.264 Accurate Re-encode</span>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" id="btn-execute-trim" class="yt-download-btn">
                                <i data-lucide="scissors"></i>
                                <span>Trim Selected Clip</span>
                            </button>
                        </form>
                    </div>
                </section>
            </main>
        </div>
        <div id="toast-container" class="toast-container"></div>
    </div>

    <nav class="mobile-bottom-nav">
        <a href="/download.html" class="mobile-nav-item" title="Home">
            <i data-lucide="home"></i>
        </a>
        <a href="/cutter.html" class="mobile-nav-item active" title="Trim">
            <i data-lucide="scissors"></i>
        </a>
        <a href="/split.html" class="mobile-nav-item" title="Split">
            <i data-lucide="grid"></i>
        </a>
        <a href="/mix.html" class="mobile-nav-item" title="Mixer">
            <i data-lucide="layers"></i>
        </a>
        <a href="/playlist.html" class="mobile-nav-item" title="Playlist">
            <i data-lucide="list-video"></i>
        </a>
    </nav>

    <script src="/static/js/common.js?v=2.0"></script>
    <script src="/static/js/cutter.js?v=2.0"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
